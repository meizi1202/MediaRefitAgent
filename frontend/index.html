<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaRefitAgent - 智能视频处理</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f0f; color: #fff; height: 100vh; overflow: hidden; }

        .app { display: grid; grid-template-columns: 220px 1fr 320px; height: 100vh; }

        /* 左侧边栏 */
        .sidebar { background: #1a1a1a; border-right: 1px solid #2a2a2a; display: flex; flex-direction: column; }
        .sidebar-header { padding: 16px; border-bottom: 1px solid #2a2a2a; }
        .new-chat-btn { width: 100%; padding: 12px; background: #4CAF50; border: none; border-radius: 8px; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .new-chat-btn:hover { background: #45a049; }

        .sessions-list { flex: 1; overflow-y: auto; padding: 8px; }
        .session-item { padding: 12px; border-radius: 8px; cursor: pointer; margin-bottom: 4px; display: flex; align-items: center; gap: 10px; transition: background 0.2s; }
        .session-item:hover { background: #2a2a2a; }
        .session-item.active { background: #2a2a2a; }
        .session-item .icon { font-size: 16px; }
        .session-item .name { flex: 1; font-size: 13px; color: #ccc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .session-item .delete { opacity: 0; padding: 4px; border-radius: 4px; background: #333; }
        .session-item:hover .delete { opacity: 1; }
        .session-item .delete:hover { background: #c00; }
        .session-rename-input { background: #333; border: 1px solid #4CAF50; border-radius: 4px; color: #fff; font-size: 13px; padding: 4px 8px; width: 100%; outline: none; }

        /* 主内容区 */
        .main { display: flex; flex-direction: column; height: 100vh; }

        /* 头部 */
        .header { padding: 12px 20px; background: #1a1a1a; border-bottom: 1px solid #2a2a2a; display: flex; align-items: center; justify-content: space-between; }
        .header-title { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }

        /* 对话区 */
        .messages { flex: 1; overflow-y: auto; padding: 20px; }
        .message { margin-bottom: 20px; display: flex; gap: 12px; }
        .message.user { flex-direction: row-reverse; }
        .message-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
        .message.user .message-avatar { background: #4CAF50; }
        .message.assistant .message-avatar { background: #9C27B0; }
        .message-content { max-width: 80%; }
        .message.user .message-content { text-align: right; }
        .message-bubble { padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.5; display: inline-block; }
        .message.user .message-bubble { background: #4CAF50; color: #fff; border-bottom-right-radius: 4px; }
        .message.assistant .message-bubble { background: #2a2a2a; color: #eee; border-bottom-left-radius: 4px; }
        .message.system .message-bubble { background: #2196F3; color: #fff; border-bottom-left-radius: 4px; font-size: 13px; }

        .message-result { margin-top: 12px; padding: 12px; background: #252525; border-radius: 8px; font-size: 12px; }
        .message-result .row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #333; }
        .message-result .row:last-child { border-bottom: none; }
        .message-result .label { color: #888; }
        .message-result .value { color: #4CAF50; }

        .message-time { font-size: 10px; color: #555; margin-top: 4px; }

        /* 空状态 */
        .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #555; }
        .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
        .empty-state p { font-size: 14px; }

        /* 功能标签栏 */
        .feature-bar { padding: 12px 20px; background: #1a1a1a; border-bottom: 1px solid #2a2a2a; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .feature-tab { padding: 8px 16px; background: #2a2a2a; border: 1px solid #333; border-radius: 8px; color: #888; font-size: 13px; cursor: pointer; transition: all 0.2s; }
        .feature-tab:hover { border-color: #4CAF50; color: #fff; }
        .feature-tab.active { background: #4CAF50; border-color: #4CAF50; color: #fff; }
        .feature-tab.disabled { opacity: 0.5; cursor: not-allowed; }

        /* 快捷参数栏 */
        .quick-params { display: none; align-items: center; gap: 12px; padding: 0 8px; }
        .quick-params.visible { display: flex; }
        .quick-param-group { display: flex; align-items: center; gap: 6px; }
        .quick-param-label { font-size: 12px; color: #666; }
        .quick-param-btn { padding: 4px 10px; background: #2a2a2a; border: 1px solid #333; border-radius: 4px; color: #888; font-size: 11px; cursor: pointer; transition: all 0.2s; }
        .quick-param-btn:hover { border-color: #4CAF50; color: #fff; }
        .quick-param-btn.active { background: #4CAF50; border-color: #4CAF50; color: #fff; }

        /* 参数面板 */
        .param-panel { padding: 12px 20px; background: #1a1a1a; border-bottom: 1px solid #2a2a2a; display: none; }
        .param-panel.visible { display: block; }
        .param-panel.empty { display: none; }
        .param-section { margin-bottom: 12px; }
        .param-section:last-child { margin-bottom: 0; }
        .param-label { font-size: 12px; color: #888; margin-bottom: 8px; }
        .param-options { display: flex; flex-wrap: wrap; gap: 6px; }
        .param-option { padding: 6px 12px; background: #2a2a2a; border: 1px solid #333; border-radius: 6px; color: #888; font-size: 12px; cursor: pointer; transition: all 0.2s; }
        .param-option:hover { border-color: #4CAF50; color: #fff; }
        .param-option.active { background: #4CAF50; border-color: #4CAF50; color: #fff; }

        /* 输入区 */
        .input-area { padding: 16px 20px; background: #1a1a1a; border-top: 1px solid #2a2a2a; }
        .input-row { display: flex; gap: 12px; align-items: flex-end; }
        .file-btn { padding: 10px 16px; background: #2a2a2a; border: 1px solid #333; border-radius: 8px; color: #888; cursor: pointer; font-size: 14px; position: relative; }
        .file-btn:hover { border-color: #4CAF50; color: #4CAF50; }
        .file-btn input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .file-btn .selected-file { position: absolute; top: -24px; left: 0; font-size: 11px; color: #4CAF50; white-space: nowrap; }
        .input-field { flex: 1; padding: 12px 16px; background: #2a2a2a; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 14px; resize: none; min-height: 44px; max-height: 120px; }
        .input-field:focus { outline: none; border-color: #4CAF50; }
        .send-btn { padding: 10px 20px; background: #4CAF50; border: none; border-radius: 8px; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
        .send-btn:hover { background: #45a049; }
        .send-btn:disabled { background: #333; color: #555; cursor: not-allowed; }

        /* 右侧预览区 */
        .preview { background: #1a1a1a; border-left: 1px solid #2a2a2a; display: flex; flex-direction: column; }
        .preview-header { padding: 16px; border-bottom: 1px solid #2a2a2a; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .preview-content { flex: 1; padding: 16px; display: flex; flex-direction: column; overflow: hidden; }
        .preview-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #555; }
        .preview-empty .icon { font-size: 48px; margin-bottom: 12px; }
        .preview-empty p { font-size: 13px; }

        .video-container { flex: 1; display: flex; flex-direction: column; gap: 12px; }
        .video-player { width: 100%; border-radius: 8px; background: #000; max-height: 280px; }
        .video-info { padding: 12px; background: #252525; border-radius: 8px; font-size: 12px; }
        .video-info .row { display: flex; justify-content: space-between; padding: 4px 0; }
        .video-info .label { color: #888; }
        .video-info .value { color: #4CAF50; }

        .preview-actions { display: flex; gap: 8px; margin-top: 12px; }
        .preview-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .preview-btn.download { background: #4CAF50; color: #fff; }
        .preview-btn.download:hover { background: #45a049; }
        .preview-btn.regenerate { background: #2a2a2a; color: #fff; border: 1px solid #333; }
        .preview-btn.regenerate:hover { border-color: #4CAF50; }

        /* 打字动画 */
        .typing-indicator { display: inline-flex; gap: 4px; padding: 4px 0; }
        .typing-indicator span { width: 6px; height: 6px; background: #888; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out; }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

        /* 消息操作按钮 */
        .message-actions { margin-top: 8px; display: flex; gap: 8px; }
        .msg-action-btn { padding: 4px 10px; background: #2a2a2a; border: 1px solid #333; border-radius: 4px; color: #888; font-size: 11px; cursor: pointer; }
        .msg-action-btn:hover { border-color: #4CAF50; color: #fff; }
    </style>
</head>
<body>
    <div class="app">
        <!-- 左侧边栏 -->
        <div class="sidebar">
            <div class="sidebar-header">
                <button class="new-chat-btn" onclick="createNewSession()">
                    <span>+</span> 新建会话
                </button>
            </div>
            <div class="sessions-list" id="sessionsList"></div>
        </div>

        <!-- 主内容区 -->
        <div class="main">
            <div class="header">
                <div class="header-title">
                    <span>🤖</span>
                    <span>MediaRefitAgent</span>
                    <span style="font-weight:normal;color:#888;font-size:12px;">智能视频处理</span>
                </div>
            </div>

            <div class="messages" id="messagesArea">
                <div class="empty-state" id="emptyState">
                    <div class="icon">💬</div>
                    <p>开始一段新的对话</p>
                </div>
            </div>

            <!-- 功能标签栏 -->
            <div class="feature-bar">
                <button class="feature-tab" data-feature="orient" onclick="selectFeature('orient', event)">横竖屏转换</button>
                <button class="feature-tab disabled" data-feature="compress">视频压缩</button>
                <button class="feature-tab disabled" data-feature="cut">视频裁剪</button>
                <button class="feature-tab disabled" data-feature="format">视频格式转换</button>
                <button class="feature-tab disabled" data-feature="info">视频信息获取</button>
            </div>

            <!-- 横竖屏转换参数面板（点击标签后展开） -->
            <div class="param-panel" id="paramPanel_orient">
                <div class="param-section">
                    <div class="param-label">目标方向</div>
                    <div class="param-options">
                        <button class="param-option" data-orientation="portrait" data-text="竖屏 9:16" onclick="selectOrientation(this)">竖屏 9:16</button>
                        <button class="param-option" data-orientation="portrait" data-text="竖屏 4:5" onclick="selectOrientation(this)">竖屏 4:5</button>
                        <button class="param-option" data-orientation="landscape" data-text="横屏 16:9" onclick="selectOrientation(this)">横屏 16:9</button>
                        <button class="param-option" data-orientation="landscape" data-text="横屏 21:9" onclick="selectOrientation(this)">横屏 21:9</button>
                        <button class="param-option" data-orientation="landscape" data-text="横屏 4:3" onclick="selectOrientation(this)">横屏 4:3</button>
                    </div>
                </div>
                <div class="param-section">
                    <div class="param-label">转换策略</div>
                    <div class="param-options">
                        <button class="param-option active" data-strategy="pad" onclick="selectStrategy(this)">填充黑边</button>
                        <button class="param-option" data-strategy="crop" onclick="selectStrategy(this)">中心裁剪</button>
                        <button class="param-option" data-strategy="pan_scroll" onclick="selectStrategy(this)">平移运镜</button>
                        <button class="param-option" data-strategy="smart_crop" onclick="selectStrategy(this)">智能裁剪</button>
                        <button class="param-option" data-strategy="stretch" onclick="selectStrategy(this)">拉伸填充</button>
                        <button class="param-option" data-strategy="mirror_scroll" onclick="selectStrategy(this)">镜像滚动</button>
                    </div>
                </div>
            </div>

            <!-- 视频压缩参数面板 (占位) -->
            <div class="param-panel" id="paramPanel_compress">
                <div class="param-section">
                    <div class="param-label">压缩质量</div>
                    <div class="param-options">
                        <button class="param-option active">高质量</button>
                        <button class="param-option">中等质量</button>
                        <button class="param-option">低质量</button>
                    </div>
                </div>
            </div>

            <!-- 视频裁剪参数面板 (占位) -->
            <div class="param-panel" id="paramPanel_cut">
                <div class="param-section">
                    <div class="param-label">裁剪区域</div>
                    <div class="param-options">
                        <button class="param-option active">自定义</button>
                        <button class="param-option">常用比例</button>
                    </div>
                </div>
            </div>

            <!-- 视频格式转换参数面板 (占位) -->
            <div class="param-panel" id="paramPanel_format">
                <div class="param-section">
                    <div class="param-label">输出格式</div>
                    <div class="param-options">
                        <button class="param-option active">MP4</button>
                        <button class="param-option">AVI</button>
                        <button class="param-option">MOV</button>
                        <button class="param-option">WebM</button>
                    </div>
                </div>
            </div>

            <!-- 视频信息获取参数面板 (占位) -->
            <div class="param-panel" id="paramPanel_info">
                <div class="param-section">
                    <div class="param-label">信息类型</div>
                    <div class="param-options">
                        <button class="param-option active">全部信息</button>
                        <button class="param-option">仅基本信息</button>
                        <button class="param-option">仅技术参数</button>
                    </div>
                </div>
            </div>

            <div class="input-area">
                <div class="input-row">
                    <div class="file-btn">
                        <span class="selected-file" id="selectedFileName"></span>
                        📤 上传视频
                        <input type="file" id="videoFile" accept="video/*">
                    </div>
                    <textarea class="input-field" id="messageInput" placeholder="输入消息描述您的需求，或上传视频后发送..." rows="1"></textarea>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()">发送</button>
                </div>
            </div>
        </div>

        <!-- 右侧预览区 -->
        <div class="preview">
            <div class="preview-header">
                <span>🎬</span>
                <span>视频预览</span>
            </div>
            <div class="preview-content" id="previewContent">
                <div class="preview-empty" id="previewEmpty">
                    <div class="icon">📹</div>
                    <p>暂无生成的视频</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://172.18.98.97:8000';
        let currentSessionId = null;
        let sessions = [];
        let currentFeature = 'orient';
        let selectedStrategy = 'pad';
        let selectedOrientation = 'portrait';
        let selectedOrientationText = '竖屏 9:16';
        let selectedFile = null;
        let currentVideoData = null;
        let lastAssistantMsgId = null;
        let msgCounter = 0;
        let assistantMsgId = null;
        const STORAGE_KEY = 'mediarefit_sessions';

        // 初始化
        loadSessions();

        // 本地存储会话
        function saveSessionsToStorage() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
        }

        function loadSessionsFromStorage() {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : [];
        }

        // 加载会话列表
        async function loadSessions() {
            sessions = loadSessionsFromStorage();
            renderSessions();

            try {
                const resp = await fetch(`${API_BASE}/api/agent/sessions`);
                const data = await resp.json();
                const serverSessions = data.sessions || [];
                serverSessions.forEach(s => {
                    if (!sessions.find(existing => existing.session_id === s.session_id)) {
                        sessions.unshift(s);
                    }
                });
                saveSessionsToStorage();
                renderSessions();
            } catch (e) {}
        }

        function renderSessions() {
            const list = document.getElementById('sessionsList');
            if (sessions.length === 0) {
                list.innerHTML = '<div style="padding:16px;color:#555;font-size:12px;text-align:center;">暂无历史会话</div>';
                return;
            }
            list.innerHTML = sessions.map(s => `
                <div class="session-item ${s.session_id === currentSessionId ? 'active' : ''}" onclick="selectSession('${s.session_id}')">
                    <span class="icon">💬</span>
                    <span class="name" ondblclick="startRenameSession('${s.session_id}', this)">${s.name || s.session_id}</span>
                    <span class="delete" onclick="event.stopPropagation(); deleteSession('${s.session_id}')">✕</span>
                </div>
            `).join('');
        }

        function startRenameSession(sessionId, nameEl) {
            const session = sessions.find(s => s.session_id === sessionId);
            if (!session) return;

            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'session-rename-input';
            input.value = session.name;

            input.onblur = () => saveRenameSession(sessionId, input.value);
            input.onkeydown = (e) => {
                if (e.key === 'Enter') {
                    saveRenameSession(sessionId, input.value);
                } else if (e.key === 'Escape') {
                    renderSessions();
                }
            };

            nameEl.replaceWith(input);
            input.focus();
            input.select();
        }

        function saveRenameSession(sessionId, newName) {
            const session = sessions.find(s => s.session_id === sessionId);
            if (session && newName.trim()) {
                session.name = newName.trim();
                saveSessionsToStorage();
            }
            renderSessions();
        }

        function createNewSession() {
            currentSessionId = null;
            document.getElementById('messagesArea').innerHTML = `
                <div class="empty-state">
                    <div class="icon">💬</div>
                    <p>开始一段新的对话</p>
                </div>
            `;
            clearPreview();
            renderSessions();
        }

        async function selectSession(sessionId) {
            currentSessionId = sessionId;
            renderSessions();

            const localSession = sessions.find(s => s.session_id === sessionId);
            if (localSession && localSession.messages) {
                renderMessages(localSession.messages);
                return;
            }

            try {
                const resp = await fetch(`${API_BASE}/api/agent/session/${sessionId}`);
                const data = await resp.json();
                renderMessages(data.messages || []);

                if (localSession) {
                    localSession.messages = data.messages || [];
                    saveSessionsToStorage();
                }
            } catch (e) {}
        }

        function renderMessages(messages) {
            const area = document.getElementById('messagesArea');
            if (messages.length === 0) {
                area.innerHTML = '<div class="empty-state"><div class="icon">💬</div><p>开始一段新的对话</p></div>';
                return;
            }
            area.innerHTML = messages.map(m => {
                const role = m.role === 'user' ? 'user' : 'assistant';
                return `
                    <div class="message ${role}">
                        <div class="message-avatar">🤖</div>
                        <div class="message-content">
                            <div class="message-bubble">${m.content}</div>
                            <div class="message-time">${formatTime(m.timestamp)}</div>
                        </div>
                    </div>
                `;
            }).join('');
            area.scrollTop = 9999;
        }

        function formatTime(ts) {
            if (!ts) return '';
            const d = new Date(ts);
            return `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
        }

        async function deleteSession(sessionId) {
            if (!confirm('确定删除此会话？')) return;
            sessions = sessions.filter(s => s.session_id !== sessionId);
            saveSessionsToStorage();
            try {
                await fetch(`${API_BASE}/api/agent/session/${sessionId}`, { method: 'DELETE' });
            } catch (e) {}
            if (currentSessionId === sessionId) createNewSession();
            renderSessions();
        }

        // 功能标签切换
        function selectFeature(feature, event) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }
            const selectedTab = document.querySelector(`.feature-tab[data-feature="${feature}"]`);
            console.log('selectedTab:', selectedTab);
            console.log('classList:', selectedTab ? Array.from(selectedTab.classList) : 'null');
            const isActive = selectedTab ? selectedTab.classList.contains('active') : false;
            console.log('isActive:', isActive);
            console.log('currentFeature before:', currentFeature);

            // 如果点击的是已选中的标签，则取消选中（收起面板）
            if (isActive) {
                selectedTab.classList.remove('active');
                // 隐藏参数面板
                document.querySelectorAll('.param-panel').forEach(panel => {
                    panel.classList.remove('visible');
                });
                // 隐藏快捷参数栏
                const quickParams = document.getElementById('quickParams');
                if (quickParams) quickParams.classList.remove('visible');
                currentFeature = null;
                return;
            }

            console.log('Tab clicked, isActive:', isActive, 'feature:', feature);

            // 否则正常选中
            const tabs = document.querySelectorAll('.feature-tab');
            tabs.forEach(tab => {
                tab.classList.remove('active');
            });

            if (selectedTab && !selectedTab.classList.contains('disabled')) {
                selectedTab.classList.add('active');
            }

            // 隐藏所有参数面板
            document.querySelectorAll('.param-panel').forEach(panel => {
                panel.classList.remove('visible');
            });

            // 隐藏快捷参数栏
            const quickParams = document.getElementById('quickParams');
            if (quickParams) quickParams.classList.remove('visible');

            // 显示对应参数面板
            const panel = document.getElementById(`paramPanel_${feature}`);
            if (panel) {
                panel.classList.add('visible');
            }

            // 横竖屏转换显示快捷参数栏
            if (feature === 'orient') {
                const quickParams = document.getElementById('quickParams');
                if (quickParams) quickParams.classList.add('visible');
            }

            currentFeature = feature;
            console.log('currentFeature after:', currentFeature);

            currentFeature = feature;
        }

        // 快捷参数选择
        function quickSelectOrientation(el) {
            document.querySelectorAll('.quick-param-group:first-child .quick-param-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            selectedOrientation = el.dataset.orientation;
            selectedOrientationText = el.dataset.text;
            // 同步更新下方面板
            document.querySelectorAll('#paramPanel_orient .param-option[data-orientation]').forEach(b => {
                b.classList.toggle('active', b.dataset.orientation === selectedOrientation);
            });
        }

        function quickSelectStrategy(el) {
            document.querySelectorAll('.quick-param-group:last-child .quick-param-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            selectedStrategy = el.dataset.strategy;
            // 同步更新下方面板
            document.querySelectorAll('#paramPanel_orient .param-option[data-strategy]').forEach(b => {
                b.classList.toggle('active', b.dataset.strategy === selectedStrategy);
            });
        }

        function selectOrientation(el) {
            document.querySelectorAll('#paramPanel_orient .param-option[data-orientation]').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            selectedOrientation = el.dataset.orientation;
            selectedOrientationText = el.dataset.text;
            // 同步更新快捷参数栏
            document.querySelectorAll('.quick-param-group:first-child .quick-param-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.orientation === selectedOrientation);
            });
        }

        function selectStrategy(el) {
            document.querySelectorAll('#paramPanel_orient .param-option[data-strategy]').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            selectedStrategy = el.dataset.strategy;
            // 同步更新快捷参数栏
            document.querySelectorAll('.quick-param-group:last-child .quick-param-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.strategy === selectedStrategy);
            });
        }

        // 发送消息
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            const fileInput = document.getElementById('videoFile');

            if (!message && !fileInput.files[0]) {
                alert('请输入消息或上传视频');
                return;
            }

            // 保存文件
            if (fileInput.files[0]) {
                selectedFile = fileInput.files[0];
            }

            // 计算完整消息（包含UI选择的参数）
            let fullMessage = message;
            if (message && currentFeature === 'orient' && selectedOrientation && selectedStrategy) {
                const strategyNames = { pad: '填充黑边', crop: '中心裁剪', pan_scroll: '平移运镜', smart_crop: '智能裁剪', stretch: '拉伸填充', mirror_scroll: '镜像滚动' };
                fullMessage = `${message} [用户已选择参数：目标方向=${selectedOrientationText}，转换策略=${strategyNames[selectedStrategy]}]`;
            }

            const emptyState = document.getElementById('emptyState');
            if (emptyState) emptyState.remove();

            addMessage('user', fullMessage || '[上传视频]');
            input.value = '';

            showAssistantTyping();

            const formData = new FormData();
            if (fileInput.files[0]) {
                formData.append('file', fileInput.files[0]);
            }

            // 根据是否有消息决定调用哪个API
            if (message) {
                formData.append('message', fullMessage);
                // 调用 Agent 接口进行 LLM 解析
                callAgentAPI(formData, fullMessage);
                return;
            }

            // 没有消息，根据当前选中的功能生成指令
            const featureNames = { orient: '横竖屏转换', compress: '视频压缩', cut: '视频裁剪', format: '视频格式转换', info: '视频信息获取' };

            if (currentFeature === 'orient' && selectedOrientation && selectedStrategy) {
                // 横竖屏转换且已选择方向和策略，直接调用 transform API
                callTransformAPI(selectedOrientation, selectedStrategy);
                return;
            } else {
                // 其他功能或未完全选择，调用 Agent 接口
                const strategyNames = { pad: '填充黑边', crop: '中心裁剪', pan_scroll: '平移运镜', smart_crop: '智能裁剪', stretch: '拉伸填充', mirror_scroll: '镜像滚动' };
                formData.append('message', `把视频转成${selectedOrientationText}，使用${strategyNames[selectedStrategy]}策略`);
                callAgentAPI(formData, `把视频转成${selectedOrientationText}，使用${strategyNames[selectedStrategy]}策略`);
                return;
            }

            async function callTransformAPI(orientation, strategy) {
                const strategyNames = { pad: '填充黑边', crop: '中心裁剪', pan_scroll: '平移运镜', smart_crop: '智能裁剪', stretch: '拉伸填充', mirror_scroll: '镜像滚动' };
                const formData = new FormData();

                // 确保文件被添加到 formData
                const fileToUpload = selectedFile || fileInput.files[0];
                if (!fileToUpload) {
                    alert('请上传视频文件');
                    return;
                }
                formData.append('file', fileToUpload);

                // 根据方向获取目标比例
                const ratioMap = {
                    'portrait': { '竖屏 9:16': 0.5625, '竖屏 4:5': 0.8 },
                    'landscape': { '横屏 16:9': 1.7778, '横屏 21:9': 2.3333, '横屏 4:3': 1.3333 }
                };
                const targetRatio = ratioMap[orientation]?.[selectedOrientationText] || 0.5625;

                formData.append('target_orientation', orientation);
                formData.append('strategy', strategy);
                formData.append('target_ratio', targetRatio);

                addMessage('user', `把视频转成${selectedOrientationText}，使用${strategyNames[strategy]}策略`);
                input.value = '';
                showAssistantTyping();

                try {
                    const resp = await fetch(`${API_BASE}/api/transform`, {
                        method: 'POST',
                        body: formData
                    });
                    const data = await resp.json();
                    hideAssistantTyping();

                    if (data.success) {
                        const msg = `转换完成！\n\n输出文件: ${data.output_path}`;
                        addMessage('assistant', msg);
                        console.log('Transform success, calling updatePreview with:', data);
                        updatePreview(data);
                    } else {
                        addMessage('assistant', `转换失败: ${data.detail || '未知错误'}`);
                    }
                } catch (e) {
                    hideAssistantTyping();
                    addMessage('assistant', `请求失败: ${e.message}`);
                }
            }

            async function callAgentAPI(formData, displayMessage) {
                try {
                    const resp = await fetch(`${API_BASE}/api/agent/chat`, {
                        method: 'POST',
                        body: formData
                    });
                    const data = await resp.json();
                    hideAssistantTyping();

                    if (data.session_id) {
                        currentSessionId = data.session_id;

                        const userMsg = { role: 'user', content: displayMessage || '[上传视频]', timestamp: new Date().toISOString() };
                        const assistantMsg = { role: 'assistant', content: data.message, timestamp: new Date().toISOString(), data: data.data };

                        let session = sessions.find(s => s.session_id === currentSessionId);
                        if (!session) {
                            // 使用用户的第一条消息作为会话标题
                            const firstUserMsg = userMsg.content.substring(0, 30) || '新会话';
                            session = {
                                session_id: currentSessionId,
                                name: firstUserMsg + (firstUserMsg.length >= 30 ? '...' : ''),
                                messages: [],
                                created: new Date().toISOString()
                            };
                            sessions.push(session);
                            saveSessionsToStorage();
                            renderSessions();
                        }

                        session.messages.push(userMsg, assistantMsg);
                        saveSessionsToStorage();

                        addMessage('assistant', data.message, data.data);
                        if (data.data && data.data.output_path) {
                            updatePreview(data.data);
                        }
                    }
                } catch (e) {
                    hideAssistantTyping();
                    addMessage('assistant', `请求失败: ${e.message}`);
                }
            }
        }

        function addMessage(role, content, data = null) {
            const area = document.getElementById('messagesArea');
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.id = `msg_${++msgCounter}`;

            let html = `
                <div class="message-avatar">${role === 'user' ? '👤' : '🤖'}</div>
                <div class="message-content">
                    <div class="message-bubble" id="bubble_${div.id}">${content.replace(/\n/g, '<br>')}</div>
            `;

            if (data && data.output_path) {
                html += `
                    <div class="message-result" style="font-size:12px;color:#888;">视频已生成，可在右侧预览区查看</div>
                `;
            }

            html += `<div class="message-time">${formatTime(new Date().toISOString())}</div></div>`;
            div.innerHTML = html;
            area.appendChild(div);
            area.scrollTop = 9999;
            return div.id;
        }

        function showAssistantTyping() {
            const area = document.getElementById('messagesArea');
            const div = document.createElement('div');
            div.className = 'message assistant';
            assistantMsgId = `msg_${++msgCounter}`;
            div.id = assistantMsgId;
            div.innerHTML = `
                <div class="message-avatar">🤖</div>
                <div class="message-content">
                    <div class="message-bubble">
                        <div class="typing-indicator">
                            <span></span><span></span><span></span>
                        </div>
                    </div>
                    <div class="message-time">${formatTime(new Date().toISOString())}</div>
                </div>
            `;
            area.appendChild(div);
            area.scrollTop = 9999;
        }

        function hideAssistantTyping() {
            if (assistantMsgId) {
                const div = document.getElementById(assistantMsgId);
                if (div) div.remove();
                assistantMsgId = null;
            }
        }

        function updateAssistantMessage(content, data = null) {
            if (!assistantMsgId) return;
            const div = document.getElementById(assistantMsgId);
            if (!div) return;

            // 替换消息内容中的英文为中文
            const contentCn = content
                .replace(/原始方向[:\s]*landscape/gi, '原始方向: 横屏')
                .replace(/原始方向[:\s]*portrait/gi, '原始方向: 竖屏')
                .replace(/原始方向[:\s]*square/gi, '原始方向: 正方形')
                .replace(/目标方向[:\s]*landscape/gi, '目标方向: 横屏')
                .replace(/目标方向[:\s]*portrait/gi, '目标方向: 竖屏')
                .replace(/目标方向[:\s]*square/gi, '目标方向: 正方形')
                .replace(/使用策略[:\s]*pad/gi, '使用策略: 填充黑边')
                .replace(/使用策略[:\s]*crop/gi, '使用策略: 中心裁剪')
                .replace(/使用策略[:\s]*smart_crop/gi, '使用策略: 智能裁剪')
                .replace(/使用策略[:\s]*stretch/gi, '使用策略: 拉伸填充')
                .replace(/使用策略[:\s]*mirror_scroll/gi, '使用策略: 镜像滚动')
                .replace(/使用策略[:\s]*pan_scroll/gi, '使用策略: 平移运镜')
                .replace(/使用策略[:\s]*rotate/gi, '使用策略: 旋转90°');

            let html = `
                <div class="message-avatar">🤖</div>
                <div class="message-content">
                    <div class="message-bubble">${contentCn.replace(/\n/g, '<br>')}</div>
            `;

            if (data && data.output_path) {
                html += `
                    <div class="message-result" style="font-size:12px;color:#888;">视频已生成，可在右侧预览区查看</div>
                    <div class="message-actions" style="margin-top:8px;display:flex;gap:8px;">
                        <button class="msg-action-btn" onclick="regenerateFromMessage()">🔄 重新生成</button>
                        <button class="msg-action-btn" onclick="deleteCurrentMessage()">🗑️ 删除</button>
                    </div>
                `;
            }

            html += `<div class="message-time">${formatTime(new Date().toISOString())}</div></div>`;
            div.innerHTML = html;
            div.className = 'message assistant';
            lastAssistantMsgId = assistantMsgId;
            assistantMsgId = null;
        }

        // 中文别名映射
        function getOrientationLabel(orient) {
            const map = { portrait: '竖屏', landscape: '横屏', square: '正方形', unknown: '未知' };
            return map[orient] || orient || '-';
        }

        function getStrategyLabel(strategy) {
            const map = {
                pad: '填充黑边', crop: '中心裁剪', smart_crop: '智能裁剪',
                stretch: '拉伸填充', mirror_scroll: '镜像滚动', pan_scroll: '平移运镜',
                rotate: '旋转90°', 'none (already target orientation)': '无需转换'
            };
            return map[strategy] || strategy || '-';
        }

        // 预览区更新
        function updatePreview(data) {
            currentVideoData = data;
            const content = document.getElementById('previewContent');

            const downloadUrl = data.download_url || `${API_BASE}/api/download/${data.output_path.split('/').pop().split('\\').pop()}`;

            content.innerHTML = `
                <div class="video-container">
                    <video class="video-player" controls playsinline>
                        <source src="${downloadUrl}" type="video/mp4">
                        您的浏览器不支持视频播放
                    </video>
                    <div class="video-info">
                        <div class="row"><span class="label">目标方向</span><span class="value">${selectedOrientationText}</span></div>
                        <div class="row"><span class="label">使用策略</span><span class="value">${getStrategyLabel(selectedStrategy)}</span></div>
                    </div>
                    <div class="preview-actions">
                        <button class="preview-btn download" onclick="downloadVideo()">⬇️ 下载</button>
                        <button class="preview-btn regenerate" onclick="regenerateVideo()">🔄 重新生成</button>
                    </div>
                </div>
            `;
        }

        function clearPreview() {
            currentVideoData = null;
            document.getElementById('previewContent').innerHTML = `
                <div class="preview-empty" id="previewEmpty">
                    <div class="icon">📹</div>
                    <p>暂无生成的视频</p>
                </div>
            `;
        }

        function downloadVideo() {
            if (!currentVideoData) return;
            const downloadUrl = currentVideoData.download_url || `${API_BASE}/api/download/${currentVideoData.output_path.split('/').pop().split('\\').pop()}`;
            window.open(downloadUrl, '_blank');
        }

        function regenerateVideo() {
            regenerateFromMessage();
        }

        function regenerateFromMessage() {
            if (!selectedFile) {
                alert('请先上传视频文件');
                return;
            }

            const targetMsgId = lastAssistantMsgId || assistantMsgId;
            if (!targetMsgId) return;

            const div = document.getElementById(targetMsgId);
            if (!div) return;

            // 显示typing状态
            div.innerHTML = `
                <div class="message-avatar">🤖</div>
                <div class="message-content">
                    <div class="message-bubble">
                        <div class="typing-indicator">
                            <span></span><span></span><span></span>
                        </div>
                    </div>
                    <div class="message-time">${formatTime(new Date().toISOString())}</div>
                </div>
            `;

            const strategyNames = { pad: '填充黑边', crop: '中心裁剪', pan_scroll: '平移运镜', smart_crop: '智能裁剪', stretch: '拉伸填充', mirror_scroll: '镜像滚动' };

            const formData = new FormData();
            formData.append('file', selectedFile);
            formData.append('message', `把视频转成${selectedOrientationText}，使用${strategyNames[selectedStrategy]}策略`);
            if (currentSessionId) {
                formData.append('session_id', currentSessionId);
            }

            fetch(`${API_BASE}/api/agent/chat`, {
                method: 'POST',
                body: formData
            })
            .then(resp => resp.json())
            .then(data => {
                if (data.session_id) {
                    currentSessionId = data.session_id;
                }
                if (data.success) {
                    updateAssistantMessageAt(targetMsgId, data.message, data.data);
                    if (data.data && data.data.output_path) {
                        updatePreview(data.data);
                    }
                } else {
                    updateAssistantMessageAt(targetMsgId, '错误: ' + data.message);
                }
            })
            .catch(err => {
                updateAssistantMessageAt(targetMsgId, '请求失败: ' + err.message);
            });
        }

        function updateAssistantMessageAt(msgId, content, data = null) {
            if (!msgId) return;
            const div = document.getElementById(msgId);
            if (!div) return;

            const contentCn = content
                .replace(/landscape/gi, '横屏')
                .replace(/portrait/gi, '竖屏');

            let html = `
                <div class="message-avatar">🤖</div>
                <div class="message-content">
                    <div class="message-bubble">${contentCn.replace(/\n/g, '<br>')}</div>
            `;

            if (data && data.output_path) {
                html += `
                    <div class="message-result" style="font-size:12px;color:#888;">视频已生成，可在右侧预览区查看</div>
                    <div class="message-actions" style="margin-top:8px;display:flex;gap:8px;">
                        <button class="msg-action-btn" onclick="regenerateFromMessage()">🔄 重新生成</button>
                        <button class="msg-action-btn" onclick="deleteCurrentMessage()">🗑️ 删除</button>
                    </div>
                `;
            }

            html += `<div class="message-time">${formatTime(new Date().toISOString())}</div></div>`;
            div.innerHTML = html;
        }

        function deleteCurrentMessage() {
            const targetMsgId = lastAssistantMsgId || assistantMsgId;
            if (!targetMsgId) return;

            const assistantEl = document.getElementById(targetMsgId);
            if (!assistantEl) return;

            assistantEl.remove();

            const userEl = assistantEl.previousElementSibling;
            if (userEl && userEl.classList.contains('message') && userEl.classList.contains('user')) {
                userEl.remove();
            }

            lastAssistantMsgId = null;
            assistantMsgId = null;
            clearPreview();
        }

        // 文件选择显示文件名
        document.getElementById('videoFile').addEventListener('change', function(e) {
            if (e.target.files[0]) {
                document.getElementById('selectedFileName').textContent = e.target.files[0].name;
            } else {
                document.getElementById('selectedFileName').textContent = '';
            }
        });

        // 回车发送
        document.getElementById('messageInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
